name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 讀取版本
        id: ver
        run: |
          CODE=$(grep '^versionCode=' android/version.properties | cut -d= -f2)
          NAME=$(grep '^versionName=' android/version.properties | cut -d= -f2)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "版本 $NAME (build $CODE)"

      - name: 取出這一版的更新說明
        id: notes
        run: |
          NAME="${{ steps.ver.outputs.name }}"
          # 從 CHANGELOG.md 抓出 "## v<版本>" 到下一個 "## " 之間的內容
          awk -v v="## v$NAME" '
            $0==v {flag=1; next}
            /^## / {flag=0}
            flag {print}
          ' android/CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then echo "（這一版沒有填寫說明）" > /tmp/notes.md; fi
          cat /tmp/notes.md

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 準備簽章金鑰
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/release.jks
            echo "RELEASE_KEYSTORE_PATH=/tmp/release.jks" >> "$GITHUB_ENV"
            echo "使用 GitHub secret 裡的金鑰"
          else
            echo "使用 repo 內的金鑰"
          fi

      - name: 建置 APK
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee /tmp/build.log

      # 失敗時把編譯輸出寫回 repo，否則沒有 Actions 讀取權限的人看不到原因。
      # 路徑刻意放在 .buildlog/，不在本流程監看的 android/** 之下，才不會觸發無限迴圈。
      - name: 失敗時保留編譯記錄
        if: failure()
        run: |
          mkdir -p .buildlog
          grep -E "^e: |error:|FAILURE|Could not|Unresolved|Caused by|\* What went wrong" /tmp/build.log \
            | head -80 > .buildlog/last-error.txt || true
          tail -120 /tmp/build.log >> .buildlog/last-error.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f .buildlog/last-error.txt
          git commit -m "建置失敗記錄 [skip ci]" || exit 0
          git push origin HEAD:main

      - name: 重新命名
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$SRC" "vlog-stitch-v${{ steps.ver.outputs.name }}.apk"
          ls -la *.apk
          echo "--- 簽章指紋（每一版都必須相同，否則更新會裝不起來）---"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          if [ -n "$SIGNER" ]; then
            "$SIGNER" verify --print-certs *.apk | grep -i "SHA-256 digest" | head -1
          else
            echo "（找不到 apksigner，略過）"
          fi

      - name: 發佈
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.ver.outputs.code }}
          name: v${{ steps.ver.outputs.name }}
          body_path: /tmp/notes.md
          files: vlog-stitch-v${{ steps.ver.outputs.name }}.apk
